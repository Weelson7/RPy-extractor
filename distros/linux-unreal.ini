; Generated by `viwo config generate` - edit startup.ini instead of this file.
; viwo 0.2.0 - distro linux-unreal

[startup]
os = linux
profile = unreal
features = extraction, sorting, merger

[plugins]
bethesda = off
doom = off
electron = off
generic = on
godot = off
kirikiri = off
overwatch = off
quickbms = off
renpy = off
rpgmaker = off
source = off
unity = off
unreal = on

[slots]
capture.gpu = renderdoc
carve.signatures = signature-carver
decode.audio = vgmstream-cli, ffmpeg-decode
decode.image = ffmpeg-image
decode.video = ffmpeg-video
media.encode = ffmpeg
pack.upak = repak-patch
pack.zip = zip-packer
unarchive.7z = sevenzip-cli, py7zr
unarchive.rar = unrar-cli, sevenzip-cli
unarchive.tar = py-tarfile, sevenzip-cli
unarchive.upak = repak-cli
unarchive.utoc = retoc-legacy, retoc-unpack
unarchive.zip = py-zipfile, sevenzip-cli

[tools]
; <dependency id> = path (found on PATH when left out)
; ffmpeg = /usr/bin/ffmpeg
; ffprobe = <path to ffprobe>
; rdpython = <path to rdpython>
; renderdoccmd = <path to renderdoccmd>
; repak = <path to repak>
; retoc = <path to retoc>
; sevenzip = /usr/bin/7z
; unrar = <path to unrar>
; vgmstream = <path to vgmstream>
