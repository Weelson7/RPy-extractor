; Generated by `viwo config generate` - edit startup.ini instead of this file.
; viwo contract 1.1 - distro linux-mixed

[startup]
os = linux
profile = mixed
features = extraction, sorting, merger

[plugins]
bethesda = on
doom = on
electron = on
generic = on
genie = on
godot = on
kirikiri = on
overwatch = on
quickbms = on
redengine = on
renpy = on
rpgmaker = on
source = on
taleworlds = on
unity = on
unreal = on
warscape = on

[slots]
analysis.dotnet = ilspycmd
analysis.il2cpp = cpp2il
analysis.native = ghidra-headless
analysis.protector = die
analysis.script = unluac
capture.gpu = renderdoc
carve.signatures = signature-carver
decode.audio = vgmstream-cli, ffmpeg-decode
decode.image = ffmpeg-image
decode.rpyc = unrpyc-cli
decode.video = ffmpeg-video
export.godot = gdre-recover
export.overwatch = datatool
export.rpgmaker = rpgmv-builtin
export.unity = unitypy, assetstudiomod-cli
handoff.native = ghidra-gui
image.convert = pillow-convert, imagemagick-convert
media.encode = ffmpeg
media.probe = ffprobe-probe, pillow-probe
pack.pck = godotpcktool-pack
pack.rpa = rpa-writer
pack.rpgmaker = rpgmv-pack
pack.unity = unitypy-pack
pack.upak = repak-patch
pack.zip = zip-packer
unarchive.7z = sevenzip-cli, py7zr
unarchive.archive = rdar-builtin
unarchive.asar = asar-builtin
unarchive.ba2 = ba2-builtin
unarchive.bms = quickbms-cli
unarchive.bsa = bsa-builtin
unarchive.drs = drs-builtin
unarchive.pack = pack-builtin
unarchive.pck = gdre-tools, godotpcktool
unarchive.rar = unrar-cli, sevenzip-cli
unarchive.rgssad = rgssad-builtin
unarchive.rpa = rpa-safe, unrpa
unarchive.tar = py-tarfile, sevenzip-cli
unarchive.tpac = tpac-builtin
unarchive.unitypackage = py-tarfile, sevenzip-cli
unarchive.upak = repak-cli, quickbms-cli
unarchive.utoc = retoc-legacy, retoc-unpack
unarchive.vpk = vpk-builtin
unarchive.wad = wad-builtin
unarchive.xp3 = xp3-builtin
unarchive.zip = py-zipfile, sevenzip-cli

[tools]
; <dependency id> = path (found on PATH when left out)
; assetstudiomod = /usr/bin/AssetStudioModCLI
; cpp2il = /usr/bin/Cpp2IL
; datatool = /usr/bin/DataTool
; die = /usr/bin/diec
; dotnet = /usr/bin/dotnet
; ffmpeg = /usr/bin/ffmpeg
; ffprobe = /usr/bin/ffprobe
; gdre = /usr/bin/gdre_tools
; ghidra = /usr/bin/analyzeHeadless
; godotpcktool = /usr/bin/godotpcktool
; ilspycmd = /usr/bin/ilspycmd
; imagemagick = /usr/bin/magick
; jdk = /usr/bin/java
; quickbms = /usr/bin/quickbms
; rdpython = /usr/bin/rdpython
; renderdoccmd = /usr/bin/renderdoccmd
; repak = /usr/bin/repak
; retoc = /usr/bin/retoc
; sevenzip = /usr/bin/7z
; unluac = /usr/bin/unluac
; unrar = /usr/bin/unrar
; unrpyc = /usr/bin/unrpyc
; vgmstream = /usr/bin/vgmstream-cli
