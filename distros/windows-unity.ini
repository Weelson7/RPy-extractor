; Generated by `viwo config generate` - edit startup.ini instead of this file.
; viwo contract 1.1 - distro windows-unity

[startup]
os = windows
profile = unity
features = extraction, sorting, merger

[plugins]
bethesda = off
doom = off
electron = off
generic = on
genie = off
godot = off
kirikiri = off
overwatch = off
quickbms = off
redengine = off
renpy = off
rpgmaker = off
source = off
taleworlds = off
unity = on
unreal = off
warscape = off

[slots]
analysis.dotnet = ilspycmd
analysis.il2cpp = cpp2il
analysis.native = ghidra-headless
analysis.script = unluac
capture.gpu = renderdoc
carve.signatures = signature-carver
decode.audio = vgmstream-cli, ffmpeg-decode
decode.image = ffmpeg-image
decode.video = ffmpeg-video
export.unity = unitypy, assetstudiomod-cli
handoff.native = ghidra-gui
image.convert = pillow-convert, imagemagick-convert
media.encode = ffmpeg
media.probe = ffprobe-probe, pillow-probe
pack.unity = unitypy-pack
pack.zip = zip-packer
unarchive.7z = sevenzip-cli, py7zr
unarchive.rar = unrar-cli, sevenzip-cli
unarchive.tar = py-tarfile, sevenzip-cli
unarchive.unitypackage = py-tarfile, sevenzip-cli
unarchive.zip = py-zipfile, sevenzip-cli

[tools]
; <dependency id> = path (found on PATH when left out)
; assetstudiomod = C:/Program Files/AssetStudioMod/AssetStudioModCLI.exe
; cpp2il = C:/Program Files/Cpp2IL/Cpp2IL.exe
; dotnet = C:/Program Files/dotnet/dotnet.exe
; ffmpeg = C:/Program Files/ffmpeg/ffmpeg.exe
; ffprobe = C:/Program Files/ffmpeg/ffprobe.exe
; ghidra = C:/Program Files/ghidra/analyzeHeadless.exe
; ilspycmd = C:/Program Files/ilspycmd/ilspycmd.exe
; imagemagick = C:/Program Files/ImageMagick/magick.exe
; jdk = C:/Program Files/java/java.exe
; rdpython = C:/Program Files/rdpython/rdpython.exe
; renderdoccmd = C:/Program Files/RenderDoc/renderdoccmd.exe
; sevenzip = C:/Program Files/7-Zip/7z.exe
; unluac = C:/Program Files/unluac/unluac.exe
; unrar = C:/Program Files/unrar/unrar.exe
; vgmstream = C:/Program Files/vgmstream/vgmstream-cli.exe
