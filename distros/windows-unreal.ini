; Generated by `viwo config generate` - edit startup.ini instead of this file.
; viwo contract 1.1 - distro windows-unreal

[startup]
os = windows
profile = unreal
features = extraction, sorting, merger

[plugins]
bethesda = off
doom = off
electron = off
generic = on
godot = off
kirikiri = off
overwatch = off
quickbms = off
renpy = off
rpgmaker = off
source = off
unity = off
unreal = on

[slots]
capture.gpu = renderdoc
carve.signatures = signature-carver
decode.audio = vgmstream-cli, ffmpeg-decode
decode.image = ffmpeg-image
decode.video = ffmpeg-video
image.convert = pillow-convert, imagemagick-convert
media.encode = ffmpeg
media.probe = ffprobe-probe, pillow-probe
pack.upak = repak-patch
pack.zip = zip-packer
unarchive.7z = sevenzip-cli, py7zr
unarchive.rar = unrar-cli, sevenzip-cli
unarchive.tar = py-tarfile, sevenzip-cli
unarchive.upak = repak-cli
unarchive.utoc = retoc-legacy, retoc-unpack
unarchive.zip = py-zipfile, sevenzip-cli

[tools]
; <dependency id> = path (found on PATH when left out)
; ffmpeg = C:/Program Files/ffmpeg/ffmpeg.exe
; ffprobe = C:/Program Files/ffmpeg/ffprobe.exe
; imagemagick = C:/Program Files/ImageMagick/magick.exe
; rdpython = C:/Program Files/rdpython/rdpython.exe
; renderdoccmd = C:/Program Files/RenderDoc/renderdoccmd.exe
; repak = C:/Program Files/repak/repak.exe
; retoc = C:/Program Files/retoc/retoc.exe
; sevenzip = C:/Program Files/7-Zip/7z.exe
; unrar = C:/Program Files/unrar/unrar.exe
; vgmstream = C:/Program Files/vgmstream/vgmstream-cli.exe
