love2d = on
overwatch = on
pyfrozen = on
qt = on
quickbms = on
redengine = on
renpy = off
rpgmaker = on
source = on
taleworlds = on
tyranoscript = on
unity = off
unreal = off
warscape = on
wolfrpg = on
xna = on

