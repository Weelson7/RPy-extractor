[startup]
os = linux
profile = custom
features = extraction, sorting, merger

[plugins]
ags = on
bannerlord = on
bethesda = on
chromium = on
cyberpunk2077 = on
defold = on
doom = on
dotnet = on
electron = on
gamemaker = on
generic = on
genie = on
godot = off
java = on
