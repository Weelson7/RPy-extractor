; Generated by `viwo config generate` - edit startup.ini instead of this file.
; viwo contract 1.1 - distro linux-custom

[startup]
os = linux
profile = custom
features = extraction, sorting, merger

[plugins]
bethesda = on
doom = on
electron = on
generic = on
godot = off
kirikiri = on
overwatch = on
quickbms = on
renpy = off
rpgmaker = on
source = on
unity = off
unreal = off

[slots]
capture.gpu = renderdoc
carve.signatures = signature-carver
decode.audio = vgmstream-cli, ffmpeg-decode
decode.image = ffmpeg-image
decode.video = ffmpeg-video
export.overwatch = datatool
export.rpgmaker = rpgmv-builtin
image.convert = pillow-convert, imagemagick-convert
media.encode = ffmpeg
media.probe = ffprobe-probe, pillow-probe
pack.rpgmaker = rpgmv-pack
pack.zip = zip-packer
unarchive.7z = sevenzip-cli, py7zr
unarchive.asar = asar-builtin
unarchive.ba2 = ba2-builtin
unarchive.bms = quickbms-cli
unarchive.bsa = bsa-builtin
unarchive.rar = unrar-cli, sevenzip-cli
unarchive.rgssad = rgssad-builtin
unarchive.tar = py-tarfile, sevenzip-cli
unarchive.vpk = vpk-builtin
unarchive.wad = wad-builtin
unarchive.xp3 = xp3-builtin
unarchive.zip = py-zipfile, sevenzip-cli

[tools]
; <dependency id> = path (found on PATH when left out)
; datatool = /usr/bin/DataTool
; ffmpeg = /usr/bin/ffmpeg
; ffprobe = /usr/bin/ffprobe
; imagemagick = /usr/bin/magick
; quickbms = /usr/bin/quickbms
; rdpython = /usr/bin/rdpython
; renderdoccmd = /usr/bin/renderdoccmd
; sevenzip = /usr/bin/7z
; unrar = /usr/bin/unrar
; vgmstream = /usr/bin/vgmstream-cli
