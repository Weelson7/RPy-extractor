; ViWo startup wiring (contract doc 9, flat prototype form).
; Comments start with ; or #. Booleans: on/off, true/false, yes/no, 1/0.

[startup]
os               = auto          ; auto | linux | windows
profile          = mixed         ; informational in Prototype A
features         = extraction, sorting, merger
auto_install     = off           ; no unpinned installs at boot
strict_preflight = off

[plugins]
generic = on
renpy   = on
unity   = on
godot   = on
doom    = on
; custom_dirs = user_plugins

[slots]
; <slot_id> = <main> [, <spare>]   ("none" leaves a position empty)
; unarchive.7z = sevenzip-cli, py7zr
; export.unity = unitypy, assetstudiomod-cli

[tools]
; <dependency id> = path to the executable (relative to this file)
; sevenzip = C:/Program Files/7-Zip/7z.exe

[server]
; web UI: python -m viwo.cli serve   (paths are relative to this file)
host      = 127.0.0.1
port      = 8081
workspace = viwo-data/workspace    ; default extraction workspace
merged    = viwo-data/merged       ; media merger outputs
logs      = viwo-data/logs
temp      = viwo-data/tmp
