; ViWo startup wiring (contract doc 9, flat prototype form).
; Comments start with ; or #. Booleans: on/off, true/false, yes/no, 1/0.

[startup]
; base = distros/windows-unity.ini   ; start from a generated distro (`viwo config generate`);
;                                    ; everything below overrides it
os               = auto          ; auto | linux | windows
profile          = mixed         ; a distro's plugin set: renpy | unity | unreal | godot | custom | mixed
features         = extraction, sorting, merger   ; switches: add analysis, capture (each says what it gates)
auto_install     = on            ; install missing pinned tools into third_party/ at startup
strict_preflight = off           ; on = `viwo serve` runs the preflight first and exits 4 if a plugin format has no tool
av_exclusions    = on            ; workspace, source and temp skip the antivirus while a job runs (Defender: elevated only)

[plugins]
generic = on
renpy   = on
unity   = on
godot   = on
doom    = on
unreal  = on
rpgmaker = on
kirikiri = on
electron = on
source   = on
bethesda = on
quickbms = on
overwatch = on  ; terms-of-service sensitive: every run carries the reminder
; custom_dirs = user_plugins

[slots]
; <slot_id> = <main> [, <spare>]   ("none" leaves a position empty)
; unarchive.7z = sevenzip-cli, py7zr
; export.unity = unitypy, assetstudiomod-cli

[tools]
; <dependency id> = path to the executable (relative to this file)
; sevenzip = C:/Program Files/7-Zip/7z.exe

; [options.quickbms]
; scripts = C:/tools/quickbms/scripts   ; "<ext>.bms" handles files ending in .<ext>

[server]
; web UI: python -m viwo.cli serve   (paths are relative to this file)
host      = 127.0.0.1
port      = 8081
workspace = viwo-data/workspace    ; default extraction workspace
merged    = viwo-data/merged       ; media merger outputs
logs      = viwo-data/logs
temp      = viwo-data/tmp
