[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viwo"
version = "1.17.0"
description = "Vidya Wormhole: cross-platform game asset extraction and curation framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Weelson" }]
dependencies = []

[project.optional-dependencies]
unity = ["UnityPy==1.25.4", "TypeTreeGeneratorAPI==0.0.10"]
sevenzip = ["py7zr==1.1.4"]
renpy = ["unrpa==2.3.0"]
lz4 = ["lz4==4.4.5"]
patch = ["capstone==5.0.9"]
runtime = ["frida-tools==14.11.0", "frida==17.25.2", "soundcard==0.4.6", "numpy==2.5.4"]
dev = ["ruff==0.17.3"]

[project.scripts]
viwo = "viwo.cli:main"

[tool.setuptools.packages.find]
include = ["viwo*"]

[tool.setuptools.package-data]
viwo = ["web/**/*", "data/**/*"]  # data/: tools.json, the Ghidra script, worker scripts

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]  # doc 17.5; owner's target: 98 % line, 95 % branch per file
branch = true
source = ["viwo"]
patch = ["subprocess"]  # CLI runs and worker scripts are measured too (parallel data files)
