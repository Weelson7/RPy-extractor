[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viwo"
version = "1.39.0"
description = "Vidya Wormhole: cross-platform game asset extraction and curation framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Weelson" }]
# Pillow is a core dependency: core/decode.py and many plugins import PIL unconditionally to
# decode images (doc 18.3). It used to arrive only transitively through UnityPy (.[unity]), so a
# minimal install broke image decoding (found on the Linux 3.10 suite). 11.3.0 is the last line
# that still supports Python 3.10 (12.x requires >=3.11); exact pin, same discipline as the pins
# in tools.json. It is a base pip dependency, not a tools.json "python" slot (ViWo never installs
# it at runtime), so it needs no hash lock and tools/pin_python.py does not touch it.
dependencies = ["Pillow==11.3.0"]

[project.optional-dependencies]
unity = ["UnityPy==1.25.4", "TypeTreeGeneratorAPI==0.0.10"]
sevenzip = ["py7zr==1.1.4"]
renpy = ["unrpa==2.3.0"]
lz4 = ["lz4==4.4.5"]
patch = ["capstone==5.0.9"]
runtime = ["frida-tools==14.11.0", "frida==17.25.2", "soundcard==0.4.6", "numpy==2.5.4"]
isolation = ["pycdlib==1.22.0"]
dev = ["ruff==0.17.3", "setuptools==84.2.1", "wheel==0.48.0"]  # the wheel test builds one

[project.scripts]
viwo = "viwo.cli:main"

[tool.setuptools.packages.find]
include = ["viwo", "viwo.*"]  # not viwo-data: a build must not walk a running job's files

[tool.setuptools.package-data]
viwo = ["web/**/*", "data/**/*", "plugins/**/*.ksy"]  # data/: tools.json, the Ghidra script, worker scripts; .ksy: bundled Kaitai definitions

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]  # doc 17.5; owner's target: 98 % line, 95 % branch per file
branch = true
source = ["viwo"]
patch = ["subprocess"]  # CLI runs and worker scripts are measured too (parallel data files)
