<!doctype html>
<html lang="en" data-theme="wormhole">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ViWo // Vidya Wormhole</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 2h12v9l-3 3H2z' fill='%230a0607' stroke='%23ff3b3b'/%3E%3Cpath d='M5 5l3 6 3-6' fill='none' stroke='%23ff3b3b' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/skin.css">
  <link rel="stylesheet" href="css/themes/wormhole.css" id="theme-link">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="ViWo, Vidya Wormhole">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 3h26v18l-8 8H3z" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M9 9l7 13 7-13" fill="none" stroke="currentColor" stroke-width="2.5"/>
          <path d="M3 27h6" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="word">VIWO</span><span class="sub">// VIDYA WORMHOLE</span>
      </div>
      <nav class="chips strip" id="strip" aria-label="Global"></nav>
      <div class="chips" id="status-chips" aria-live="polite" aria-label="Status"></div>
      <button type="button" class="ws-path" id="game-btn" title="The game every arm works on (read-only). Click to pick another.">
        <span class="lbl">GAME</span><span class="mono" id="game-sel">—</span><span class="ws-edit">PICK</span>
      </button>
      <button type="button" class="ws-path" id="ws-btn" title="The folder ViWo extracts into and works on. Click to switch.">
        <span class="lbl">WORKSPACE</span><span class="mono" id="ws-path">—</span><span class="ws-edit">SWITCH</span>
      </button>
    </header>

    <nav class="rail" aria-label="Modules">
      <div class="arms" id="arms"></div>
      <ol class="mods" id="mods"></ol>
      <div class="rail-foot">
        <p class="ver mono" id="ver">LOCAL-FIRST // 127.0.0.1</p>
      </div>
    </nav>

    <main id="main" tabindex="-1"></main>

    <aside class="dock" id="dock" aria-label="Activity console">
      <div class="dock-h">
        <button class="dock-toggle" id="dock-toggle" aria-expanded="false" aria-controls="dock-body">
          <span class="idx">//</span> ACTIVITY CONSOLE <span class="mono dim" id="dock-count"></span>
        </button>
        <button class="btn sm ghost" id="dock-clear" aria-label="Clear the activity console">CLEAR</button>
      </div>
      <pre class="log" id="dock-body" hidden></pre>
    </aside>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
