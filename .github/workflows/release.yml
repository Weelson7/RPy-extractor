name: release

# Runs when a major tag (vN.0.0) is pushed, or by hand (Actions > release > Run workflow): one
# Windows job. Builds the wheel + sdist and the portable Windows bundle (viwo.exe, no Python
# needed), smoke-tests the bundle, and publishes the GitHub release for that tag.
on:
  push:
    tags: ["v[0-9]+.0.0"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub release (otherwise only build artifacts)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Build tools
        run: python -m pip install build==1.3.0 pyinstaller==6.22.3 -e ".[unity,sevenzip,renpy,lz4]"
      - name: Wheel and sdist
        run: python -m build --outdir release
      - name: Portable bundle (built and smoke-tested)
        run: python packaging/build_portable.py --out build-portable
      - name: Zip the bundle
        shell: pwsh
        run: Compress-Archive -Path build-portable/viwo -DestinationPath "release/ViWo-${{ steps.version.outputs.version }}-windows-x64.zip"
      - name: Checksums
        shell: bash
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: viwo-${{ steps.version.outputs.version }}
          path: release/
      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" release/* --target "${{ github.sha }}" --title "ViWo $v" --notes-file docs/release-notes.md
