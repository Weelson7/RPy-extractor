name: ci

# Cost policy (owner's rule): CI runs only for MAJOR releases, i.e. when a tag vN.0.0 is
# pushed, or when started by hand (Actions > ci > Run workflow). Nothing runs on ordinary
# pushes or pull requests, and there is no schedule. Run the tests locally instead:
#   python -m unittest discover -s tests -t .   and   python tools/loc_count.py
on:
  push:
    tags: ["v[0-9]+.0.0"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: L0 format, lint, LoC caps
        run: |
          python -m pip install ruff==0.17.3
          ruff format --check viwo tests tools
          ruff check viwo tests tools
          python tools/loc_count.py --report
      - name: L1-L4, L6 (fakes and synthetic fixtures) under coverage
        env:
          VIWO_UI: "0"
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s tests -t . -v
          python -m coverage combine
          python -m coverage json -o coverage.json
      - name: Coverage floors (doc 17.5)
        run: python tools/coverage_check.py coverage.json

  real-tools:
    # L5: real third-party tools at pinned versions (major releases / by hand).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ViWo and every pinned tool (viwo/data/tools.json, into third_party/)
        run: |
          python -m pip install -e ".[unity,sevenzip,renpy,lz4]"
          viwo install --all
          viwo slots
      - name: Freedoom 0.13.0 (BSD game data for the Doom plugin)
        shell: bash
        continue-on-error: true
        run: |
          gh release download v0.13.0 -R freedoom/freedoom -p "freedoom-0.13.0.zip" -D fd
          cd fd && unzip -q freedoom-0.13.0.zip && dir="$PWD/freedoom-0.13.0"
          if [ "$RUNNER_OS" = "Windows" ]; then dir=$(cygpath -w "$dir"); fi
          echo "VIWO_FREEDOOM=$dir" >> "$GITHUB_ENV"
      - name: L5 real-tool smoke tests
        env:
          VIWO_L5: "1"
        run: python -m unittest discover -s tests -t . -v
